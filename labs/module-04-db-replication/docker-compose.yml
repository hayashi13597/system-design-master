version: '3.8'

services:
  # 1. PostgreSQL Primary (Master - Read & Write)
  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    command: |
      postgres 
      -c wal_level=replica 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby=on
    networks:
      - db-network

  # 2. PostgreSQL Replica 1 (Read-Only)
  postgres-replica-1:
    image: postgres:16-alpine
    container_name: postgres-replica-1
    environment:
      PGUSER: postgres
      PGPASSWORD: rootpassword
    ports:
      - "5433:5432"
    depends_on:
      - postgres-primary
    networks:
      - db-network

  # 3. PostgreSQL Replica 2 (Read-Only)
  postgres-replica-2:
    image: postgres:16-alpine
    container_name: postgres-replica-2
    environment:
      PGUSER: postgres
      PGPASSWORD: rootpassword
    ports:
      - "5434:5432"
    depends_on:
      - postgres-primary
    networks:
      - db-network

networks:
  db-network:
    driver: bridge
