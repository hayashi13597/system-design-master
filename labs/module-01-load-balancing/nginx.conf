events {
    worker_connections 1024;
}

http {
    # Định nghĩa cụm upstream gồm 3 backend node
    upstream backend_cluster {
        # Thuật toán cân bằng tải: có thể dùng mặc định (Round Robin) hoặc least_conn
        # least_conn;

        server app-node-1:3000 max_fails=2 fail_timeout=5s;
        server app-node-2:3000 max_fails=2 fail_timeout=5s;
        server app-node-3:3000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Endpoint giám sát trạng thái cơ bản của Nginx
        location /nginx-health {
            return 200 '{"status":"UP","gateway":"nginx"}\n';
            add_header Content-Type application/json;
        }

        location / {
            proxy_pass http://backend_cluster;

            # Chuyển tiếp các thông tin định danh của Client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cấu hình Timeouts để tránh treo kết nối
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;

            # Cơ chế Tự động phục hồi (Passive Failover):
            # Nếu 1 node trả về lỗi kết nối, timeout hoặc 502/503, tự động chuyển tiếp request sang node kế tiếp!
            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Thêm header phản hồi để Client biết node nào trong cluster đã xử lý
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Response-Time $upstream_response_time always;
        }
    }
}
