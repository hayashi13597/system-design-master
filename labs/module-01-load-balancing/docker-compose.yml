version: '3.8'

services:
  # Load Balancer Nginx
  load-balancer:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-node-1
      - app-node-2
      - app-node-3
    networks:
      - cluster-network

  # Node 1
  app-node-1:
    build: .
    container_name: app-node-1
    environment:
      - PORT=3000
      - INSTANCE_ID=app-node-1
    networks:
      - cluster-network

  # Node 2
  app-node-2:
    build: .
    container_name: app-node-2
    environment:
      - PORT=3000
      - INSTANCE_ID=app-node-2
    networks:
      - cluster-network

  # Node 3
  app-node-3:
    build: .
    container_name: app-node-3
    environment:
      - PORT=3000
      - INSTANCE_ID=app-node-3
    networks:
      - cluster-network

networks:
  cluster-network:
    driver: bridge
